# Publishes ONLY the website. Off until the repository variable KG_ENABLE_PAGES is the word true.
# GitHub Pages itself must be set to "GitHub Actions", not "Deploy from a branch".
# See docs/WORKFLOWS.md and docs/GO-LIVE.md.
name: Publish the website

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.KG_ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node tools/ci/assemble-site.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
