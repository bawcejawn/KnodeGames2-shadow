# The one check for a pull request. It does not start on a timer and it does not deploy.
# Turn contract builds and the audit gate on or off with nothing else: they are part of this file on purpose.
name: CI

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Contract builds match contracts/hashes.json (no upload)
        run: npm run test:hashes
      - name: Dependency audit
        run: npm audit --audit-level=high
